<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <title>AI Chat Assistant</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
       body {
        font-family: "Press Start 2P", sans-serif;
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
        background: #000;
        color: #00ff41;
    }

    #chat-box {
        border: 1px solid #00ff41;
        border-radius: 8px;
        height: 500px;
        overflow-y: auto;
        padding: 15px;
        margin-bottom: 10px;
        background: #000;
    }

        .user-msg { color: #ffffff; margin: 8px 0; }
        .bot-msg  { color: #00cc33; margin: 8px 0; }
        .bot-msg p { margin: 0 0 6px 0; }
        .bot-msg code {color: yellow;}
        .bot-msg pre {color: yellow;}

        #input-row {display: flex;gap: 8px;}

        #user-input {
            flex: 1;
            padding: 8px;
            font-size: 0.70rem;
            font-family: "Press Start 2P", sans-serif;
            border: 1px solid #00ff41;
            border-radius: 6px;
            background: #000;
            color: #00ff41;
            resize: none;
            overflow-y: hidden;
        }

    button {
        padding: 8px 16px;
        cursor: pointer;
        background: #000;
        color: #00ff41;
        border: 1px solid #00ff41;
        font-family: "Press Start 2P", sans-serif;
    }

    button:hover {
        background: #00ff41;
        color: #000;
    }
    </style>
</head>
<body>
    <h2>AI Chat Assistant  <img src="/static/icons/computer.svg" width="40" height="40" style="cursor:pointer;" /></h2>
   

    <div id="chat-box"></div>

    <div id="input-row">
        <input type="file" id="file-input" accept="image/*, .pdf" style="display:none;" />
        
        <label for="file-input"><img src="/static/icons/clip.svg" width="20" height="20" style="cursor:pointer;" /></label>
        <textarea id="user-input" placeholder="Type a message..." autocomplete="off" rows="1"></textarea>
        
        
    </div>
    <button onclick="sendMessage()">Send</button>
    <button onclick="resetChat()">Reset</button>
    <small id="file-name" style="color: #00ff41; align-self: center;"></small>

    <script>
        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');

        document.getElementById('file-input').addEventListener('change', function() {
            const name = this.files[0] ? this.files[0].name : '';
            document.getElementById('file-name').textContent = name;
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = this.scrollHeight + 'px';
        });

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            append('You: ' + message, 'user-msg');
            userInput.value = '';

            const thinkingId = 'thinking-' + Date.now();
            append('Bot: thinking...', 'bot-msg', thinkingId);

            const formData = new FormData();
            formData.append('message', message);

            const file = document.getElementById('file-input').files[0];
            if (file) {
                formData.append('file', file);
                document.getElementById('file-input').value = '';
                document.getElementById('file-name').textContent = '';
            }

            try {
                const response = await fetch('/chat', { method: 'POST', body: formData });
                const data = await response.json();
                document.getElementById(thinkingId).remove();
                const botDiv = document.createElement('div');
                botDiv.classList.add('bot-msg');
                // add a copy button for each response
                // + '<br><button onclick="copyText(this)" style="font-size:0.75rem; margin-top:4px; padding: 2px 8px;">Copy</button>'
                botDiv.innerHTML = 'Bot: ' + marked.parse(data.reply);
                chatBox.appendChild(botDiv);
            } catch (err) {
                document.getElementById(thinkingId).remove();
                append('Bot: Error connecting to server.', 'bot-msg');
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function resetChat() {
            await fetch('/reset', { method: 'POST' });
            chatBox.innerHTML = '';
        }

        function append(text, className, id = null) {
            const div = document.createElement('div');
            div.classList.add(className);
            if (id) div.id = id;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
